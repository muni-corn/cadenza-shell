[package]
name = "cadenza-shell"
version = "0.1.0"
edition = "2024"
description = "muni's desktop shell - a modern desktop shell built with Rust and GTK4"

[dependencies]
anyhow = "1"
async-channel = "2.3"
bluer = { version = "0.17", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4.0"
dirs = "6.0.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures-lite = { version = "2", default-features = false }
gdk4 = { version = "0.11", features = ["v4_14"] }
gio = "0.22"
glib = "0.22"
gtk4 = { version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
inotify = "0.11"
tracing = { version = "0.1", features = ["release_max_level_info"] }
mpris = "2.0.1"
niri-ipc = "26.4"
pango = "0.22"
pulse = { version = "2.30", package = "libpulse-binding" }
relm4 = { version = "0.11" }
relm4-components = "0.11"
relm4-icons = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rsass = "0.29"
serde = { version = "1", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1"
serde_repr = "0.1"
system-tray = "0.8.3"
systemstat = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
udev = { version = "0.9.3", features = ["send", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
glib-build-tools = "0.22"
relm4-icons-build = "0.11"

[features]
default = []
docs = []
