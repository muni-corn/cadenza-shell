# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  cocoa:
    url: github:muni-corn/cocoa
    inputs:
      nixpkgs:
        follows: nixpkgs
  crane:
    url: github:ipetkov/crane
    inputs:
      nixpkgs:
        follows: nixpkgs
  flake-parts:
    url: github:hercules-ci/flake-parts
    inputs:
      nixpkgs-lib:
        follows: nixpkgs
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  musicaloft-shell:
    url: github:musicaloft/musicaloft-shell
    flake: false
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
imports:
  - musicaloft-shell
secretspec:
  enable: true
  profile: default
  provider: keyring
